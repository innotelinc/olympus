platforms:
  telegram:
    enabled: true
    bot_token: "ENV_VAR"
    provider: "openrouter"
    # The model id is the GATEWAY's, not OpenRouter's: everything on this estate
    # reaches a model through OmniRoute, which names an OpenRouter model
    # `openrouter/<org>/<model>` — the same form `web/studio/lib/omniroute.ts`
    # and `OMNIROUTE_MODEL` already use. Two things were wrong with the previous
    # value, and together they are the "model provider failed after retries" this
    # bot reported: it carried no `openrouter/` prefix, and the free Hermes 3 70B
    # slug has since been retired upstream, so the gateway answers
    # `nousresearch/hermes-3-llama-3-70b:free is not a valid model ID`. Hermes 3
    # 405B is the same family and was verified answering through the gateway.
    model: "openrouter/nousresearch/hermes-3-llama-3.1-405b"

# `apiBaseUrl` used to be `http://localhost:20128/v1` — the gateway's own port,
# which was right only while a gateway ran on the same box as the assistant. It
# does not: the platform runs ONE OmniRoute, standalone in `ips/extensions/llm/`,
# and this stack runs none. `localhost` here is the assistant itself. The address
# below is that gateway, reached through the SSO proxy in front of it (:20128,
# which exempts /v1 for API clients); see the OmniRoute block in .env.example.
assistants:
  codex:
    codexBinaryPath: "codex"
    apiBaseUrl: "http://192.168.1.71:20128/v1"
    defaultModel: "auto/coding"
  claude:
    # This is the Claude Code executable, not the Archon workflow launcher. Pointing
    # it at Archon made the provider pass Claude-only flags such as --output-format
    # back into Archon, so title generation retried and fell back before a build even
    # started.
    claudeBinaryPath: "claude"
    apiBaseUrl: "http://192.168.1.71:20128/v1"
    defaultModel: "auto/coding"

# NEW: Instructs the harness where to export freshly manufactured apps
factory_settings:
  output_dir: "./builds"
  scaffold_templates: "./core-modules/ai-software-factory/templates"
