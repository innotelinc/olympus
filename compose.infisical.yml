# ═══════════════════════════════════════════════════════════════════════════
# compose.infisical.yml — SecretOps profile (opt-in)
#
# Infisical owns secrets for the stack (see docs/stack.md golden rules): the
# credentials the factory and Studio consume are imported into an Infisical
# workspace, and .env is derived from it. This profile brings up that store.
#
# Usage:
#   docker compose -f compose.infisical.yml --profile infisical up -d
#   make up            # same thing
#
# Generate the three required keys first (see .env.example):
#   openssl rand -base64 32   # INFISICAL_ENCRYPTION_KEY
#   openssl rand -hex 16      # INFISICAL_AUTH_SECRET
#   openssl rand -hex 16      # INFISICAL_DB_PASSWORD
#
# The profile is on every service, so a plain `docker compose up` against this
# file still starts nothing until you ask for it.
# ═══════════════════════════════════════════════════════════════════════════

services:
  infisical:
    image: infisical/infisical:latest-postgres
    container_name: olympus-infisical
    profiles: ["infisical"]
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD:-}@infisical-db:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      # Public address of this instance — written back into .env as INFISICAL_ADDR.
      SITE_URL: ${INFISICAL_ADDR:-http://localhost:8088}
      TELEMETRY_ENABLED: "false"
    ports:
      - "${INFISICAL_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/status >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  infisical-db:
    image: postgres:14-alpine
    container_name: olympus-infisical-db
    profiles: ["infisical"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:-}
      POSTGRES_DB: infisical
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 10

  infisical-redis:
    image: redis:7-alpine
    container_name: olympus-infisical-redis
    profiles: ["infisical"]
    restart: unless-stopped
    volumes:
      - infisical-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  infisical-db-data:
  infisical-redis-data:

networks:
  default:
    name: olympus-infisical-net
