# compose.host-gateway.yml — reach a loopback-published gateway with host networking.
#
# WHY THIS EXISTS
# ---------------
# The gateway this stack talks to is published on the host's loopback only
# (`127.0.0.1:20128`), and Docker publishes a loopback binding to the loopback
# interface alone. A bridge container therefore cannot reach it. All four
# candidate addresses were probed from a bridge container and all four failed:
#
#   http://host.docker.internal:20128/v1   -> no connection
#   http://172.17.0.1:20128/v1             -> no connection
#   http://192.168.1.10:20128/v1           -> no connection
#
# This is the topology docker-compose.yml documents as "loopback-published on
# host" — the sanctioned answer is host networking plus
# `OMNIROUTE_BASE_URL=http://127.0.0.1:20128/v1`, which is what this file does.
#
# WHO NEEDS IT
# ------------
# Every service here that talks to the gateway, not just `olympus`: `studio` too.
# The failure is silent and it was measured on this deployment — Studio was rebuilt
# from the base file alone, landed on the bridge network, and resolved its own
# `OMNIROUTE_BASE_URL` (`http://127.0.0.1:20128/v1`) to itself:
#
#   http://127.0.0.1:20128/healthz -> FAIL ECONNREFUSED   (from inside Studio)
#   http://10.10.2.1:20128/healthz -> 200                 (the shared gateway, over the mesh)
#
# That second probe is what identifies this case rather than a gateway that is
# simply down: the address that works is NOT the one in `OMNIROUTE_BASE_URL`.
#
# Studio stayed `healthy` throughout, because its healthcheck only asks whether
# Studio answers. The UI showed an empty pane and the gateway log showed nothing
# at all, since no request ever arrived. Use `make docker-studio-up` rather than
# `docker compose up -d studio` so a rebuild cannot drop this.
#
# WHEN NOT TO USE IT
# ------------------
# Leave it out if the gateway is published on 0.0.0.0, if it is the shared one on
# another host (then the base file's mesh default already covers you), or if this
# stack talks to it only from shell scripts. Read the caveat at the top of
# docker-compose.yml before changing anything here.
#
# USAGE
# -----
#   docker compose -f docker-compose.yml -f compose.host-gateway.yml up -d
#
# `ports` and `extra_hosts` are cleared rather than left in place: Docker
# discards published ports in host mode and warns loudly, and host.docker.internal
# is pointless when the container already shares the host's network namespace.
# An explicit override keeps the output honest instead of papering over it.

services:
  olympus:
    network_mode: host
    ports: !override []
    extra_hosts: !override []

  studio:
    network_mode: host
    ports: !override []
    extra_hosts: !override []
