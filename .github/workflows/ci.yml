# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static checks on push and pull requests.
#
# The repo is maintained at zero findings: structure, compose, hooks, and the
# landing page stay conformant. Attribution guard lives in its own workflow.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conformant structure
        run: |
          set -euo pipefail
          for f in README.md LICENSE .env.example web/landing/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          echo "structure: ok"

      - name: .gitignore covers .env
        run: |
          set -euo pipefail
          if ! grep -q '^\.env' .gitignore; then
            echo "::warning:: .gitignore does not list .env"
          fi

      - name: Shell + Python compile checks
        run: |
          set -euo pipefail
          bash -n setup.sh
          if [ -f scripts/bootstrap.sh ]; then bash -n scripts/bootstrap.sh; fi
          if [ -f scripts/omniroute-vault.sh ]; then bash -n scripts/omniroute-vault.sh; fi
          bash -n scripts/notify-telegram.sh
          bash -n scripts/studio-token-alert.sh
          bash -n scripts/vault-renew-alert.sh
          bash -n scripts/build-model-alert.sh
          bash -n scripts/install-token-check-timer.sh
          bash -n scripts/studio-export-dir.sh
          bash -n scripts/install-build-runner.sh
          bash -n scripts/manufacture.sh
          python3 -m compileall -q scripts/build-runner.py scripts/prune-builds.py scripts/omniroute-restore-providers.py
          python3 -m compileall -q scripts/vault-bootstrap.py scripts/authentik-studio-app.py
          python3 -m compileall -q scripts/authentik-studio-token.py scripts/build-model-check.py
          python3 -m compileall -q scripts/cerulean-edge.py
          # The rotation program is generated, so it has to stay valid Python.
          python3 scripts/authentik-studio-token.py --snippet > /tmp/studio-token-snippet.py
          python3 -c "compile(open('/tmp/studio-token-snippet.py').read(), 'snippet', 'exec')"
          python3 -m compileall -q factory harness 2>/dev/null || echo "nothing to compile — ok"

      - name: Script unit tests (runner, prune, model check)
        run: |
          set -euo pipefail
          # The runner turns a file written by a browser-facing service into a
          # command run on the host, prune deletes built apps, and the model check
          # decides whether a build can write anything at all. These assert the
          # refusals — traversal, path-shaped slugs, symlinks out of
          # build-requests/, a 200 that answers in prose, a restore that would
          # clobber the gateway's live encryption key — rather than discovering
          # them. No gateway is needed: the check's classification is pure and its
          # exit codes are driven against a closed port.
          python3 -m unittest discover -s scripts/tests -t scripts/tests

      - name: App-builder workflow checks
        run: |
          set -euo pipefail
          # The greenfield app builder runs these as `archon workflow run` script nodes.
          # A syntax error here is only discovered by a model run that costs minutes, so
          # it is worth catching at compile time instead.
          WF=.archon/workflows/app/greenfield
          [ -f "$WF/archon-greenfield.yaml" ] || { echo "::error::missing $WF/archon-greenfield.yaml"; exit 1; }
          python3 -m compileall -q "$WF/scripts"
          # Every script the YAML references must exist. Read out of the workflow
          # rather than listed here: a node added to the YAML whose script was not
          # added beside it otherwise fails at run time, inside a model run that
          # costs minutes — and a list in this file does not notice it was not
          # updated, which is exactly how the missing workflow this checks for got
          # written in the first place.
          grep -oE '^[[:space:]]+script: [a-z0-9-]+' "$WF/archon-greenfield.yaml" \
            | awk '{print $2}' | sort -u | while read -r s; do
            [ -f "$WF/scripts/$s.py" ] \
              || { echo "::error::missing script node $s ($WF/scripts/$s.py)"; exit 1; }
          done
          # The node list is not empty, so the grep above is still matching something.
          nodes=$(grep -cE '^[[:space:]]+script: [a-z0-9-]+' "$WF/archon-greenfield.yaml")
          [ "$nodes" -ge 4 ] || { echo "::error::only $nodes script node(s) found in the workflow"; exit 1; }

          # A retry has to stay sayable. The load node refuses to overwrite an app that
          # already exists, and the build a retry is about is precisely the one that has
          # output — so without this consent every retry of a project that produced files
          # is refused, which is how the refusal was found. Asserted end to end because
          # the input is useless if it does not reach the node that reads it.
          grep -qE '^[[:space:]]+replace:' "$WF/archon-greenfield.yaml" \
            || { echo "::error::$WF/archon-greenfield.yaml no longer declares the 'replace' input"; exit 1; }
          grep -qF 'replace: "$INPUTS.replace"' "$WF/archon-greenfield.yaml" \
            || { echo "::error::the load node no longer passes \$INPUTS.replace — a rebuild would be refused"; exit 1; }
          grep -qF 'INPUTS_REPLACE' "$WF/scripts/load-spec.py" \
            || { echo "::error::load-spec.py no longer reads INPUTS_REPLACE"; exit 1; }
          grep -qF 'REPLACE' scripts/manufacture.sh \
            || { echo "::error::manufacture.sh no longer passes the rebuild consent"; exit 1; }

          # Every node in this workflow declares `runtime: uv` and Archon resolves it
          # through that binary, which nothing installs by default: not the runner
          # image, not setup.sh until it was added. Missing, it fails on the first node
          # before the spec is read — minutes of model run saved by checking here.
          grep -qF 'runtime: uv' "$WF/archon-greenfield.yaml" \
            || { echo "::error::no node declares runtime: uv — this check assumes uv"; exit 1; }
          grep -qF 'astral-sh/setup-uv' .github/workflows/olympus-app-builder.yml \
            || { echo "::error::olympus-app-builder.yml no longer installs uv, which every node needs"; exit 1; }
          grep -qF 'check_command "uv"' setup.sh \
            || { echo "::error::setup.sh no longer requires uv"; exit 1; }

          # The workflow engine. A source clone does not contain the binary, so the job
          # has to install it — the run that proved this died on "no working archon CLI
          # found" after every other step had passed.
          grep -qF 'archon.diy/install' .github/workflows/olympus-app-builder.yml \
            || { echo "::error::olympus-app-builder.yml no longer installs the Archon CLI that manufacture.sh requires"; exit 1; }

          # The build needs a gateway, and a GitHub-hosted runner cannot route to a LAN
          # one. The job reports that and manufactures nothing; if the runner stops being
          # selectable, that report is all it can ever do.
          grep -qF 'vars.OLYMPUS_BUILD_RUNNER' .github/workflows/olympus-app-builder.yml \
            || { echo "::error::olympus-app-builder.yml no longer lets a routed runner be selected"; exit 1; }

      - name: Compose files render
        run: |
          set -euo pipefail
          # Rendered against .env.example, never .env. A renamed or misspelled
          # variable here breaks `make docker-up-host` / `make gateway-sso-up`
          # with a message about an unset value rather than failing to start, so
          # it is worth catching without a deployment.
          make check-compose

  secrets:
    name: Credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No literal credentials in tracked files
        run: python3 scripts/secret-scan.py

  studio:
    name: Studio (web/studio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Drives the real authorization-code + PKCE handshake against a live Authentik.
  #
  # Off by default. To switch it on, set the repository variable AUTHENTIK_E2E to
  # "true" plus these secrets:
  #   E2E_OIDC_ISSUER_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
  #   E2E_AUTHENTIK_URL, E2E_USERNAME, E2E_PASSWORD
  # A lab provider with a self-signed certificate also needs the repository
  # variable E2E_INSECURE=1.
  #
  # Two prerequisites, both outside this repo:
  #   * the identity provider must have http://localhost:3001/api/auth/callback
  #     registered as a redirect URI for this client;
  #   * the runner must be able to reach the provider, which for a LAN-only
  #     Authentik means a self-hosted runner — set AUTHENTIK_E2E_RUNNER to its
  #     label. A GitHub-hosted runner cannot route to a private address.
  authentik-e2e:
    name: Live Authentik handshake
    if: ${{ vars.AUTHENTIK_E2E == 'true' }}
    runs-on: ${{ vars.AUTHENTIK_E2E_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web/studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Studio
        env:
          OIDC_ISSUER_URL: ${{ secrets.E2E_OIDC_ISSUER_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_REDIRECT_URI: http://localhost:3001/api/auth/callback
        run: |
          set -euo pipefail
          nohup npm run start > /tmp/studio-e2e.log 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:3001/ || true)
            # 307 means auth is on and the root bounces to sign-in.
            if [ "$code" = "307" ]; then echo "studio: ready"; exit 0; fi
            sleep 1
          done
          echo "::error::Studio never became ready"
          tail -40 /tmp/studio-e2e.log
          exit 1

      - name: Handshake against the provider
        env:
          STUDIO_E2E_BASE_URL: http://localhost:3001
          STUDIO_E2E_AUTHENTIK_URL: ${{ secrets.E2E_AUTHENTIK_URL }}
          STUDIO_E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          STUDIO_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          STUDIO_E2E_INSECURE: ${{ vars.E2E_INSECURE || '0' }}
        run: npm run test:integration

      - name: Studio log
        if: failure()
        run: tail -60 /tmp/studio-e2e.log

  landing:
    name: Landing page sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Landing sanity
        run: |
          set -euo pipefail
          f=web/landing/index.html
          grep -qi '<title>' "$f" || { echo "::error::landing has no <title>"; exit 1; }
          grep -qi 'og:title' "$f" || { echo "::error::landing has no og:title"; exit 1; }
          grep -qi 'data:image/svg+xml' "$f" || { echo "::error::landing has no SVG favicon"; exit 1; }
          echo "landing: ok"
