name: 🏭 Olympus App Manufacturing Engine

# Only a genuinely new spec should manufacture an app. Note that `paths` alone is
# not enough: a force-push (e.g. a history rewrite) re-presents the whole tree, so
# this workflow runs even when no spec was added. The resolve step below decides,
# and every later step is gated on its output.
on:
  push:
    paths:
      - 'build-requests/*.md'
  # The push filter is a spec landing in build-requests/, so a change to THIS file
  # cannot re-run the job it changed — the only way to exercise a fix to it is to name
  # a spec by hand. An empty spec is a refusal, not "newest wins": manufacturing costs a
  # model run and writes an app nobody asked for.
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec to manufacture, e.g. build-requests/resume-generator.md. Empty manufactures nothing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-new-app:
    # The build talks to the platform gateway. When that gateway is only on the LAN,
    # a GitHub-hosted runner cannot route to it, so set the OLYMPUS_BUILD_RUNNER repo
    # variable to the label of a runner that can (the same shape as
    # AUTHENTIK_E2E_RUNNER in ci.yml). Set OMNIROUTE_BASE_URL as well when the runner
    # reaches a different door than the default below.
    runs-on: ${{ vars.OLYMPUS_BUILD_RUNNER || 'ubuntu-latest' }}
    outputs:
      found: ${{ steps.spec.outputs.found }}
    steps:
      - name: 📁 Checkout Olympus Workspace
        uses: actions/checkout@v7
        with:
          # Need history to diff the pushed range, not just the tip.
          fetch-depth: 0

      - name: 🔎 Resolve the spec (a push's new spec, or one named by hand)
        id: spec
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          EVENT: ${{ github.event_name }}
          DISPATCH_SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail

          # A manual run names its spec, because it is the only way to run this job when
          # no spec was added — a fix to the workflow itself, or a spec already pushed.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "${DISPATCH_SPEC:-}" ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "workflow_dispatch with no spec given — nothing to manufacture."
              exit 0
            fi
            if [ ! -f "$DISPATCH_SPEC" ]; then
              echo "::error::no such spec in this checkout: $DISPATCH_SPEC"
              exit 1
            fi
            printf 'specs=%s\n' "$DISPATCH_SPEC" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '  %s\n' "$DISPATCH_SPEC"
            exit 0
          fi

          head_sha="${AFTER:-$GITHUB_SHA}"

          # `before` is all-zeros on a new branch, and unreachable after a
          # force-push. Neither means "a new spec was written", so skip rather
          # than manufacture from a rewrite.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No usable previous commit (new branch or rewritten history) — nothing to manufacture."
            exit 0
          fi

          mapfile -t specs < <(
            git diff --name-only --diff-filter=A "$BEFORE..$head_sha" -- 'build-requests/*.md' \
              | grep -v 'README.md' || true
          )

          if [ "${#specs[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new build-requests/*.md in $BEFORE..$head_sha — nothing to manufacture."
            exit 0
          fi

          printf 'specs=%s\n' "${specs[*]}" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf '  %s\n' "${specs[@]}"

      - name: ⚙️ Setup Monolithic Runtimes (Node & Python)
        if: steps.spec.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: 🍞 Setup Bun
        if: steps.spec.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
      - name: 🐍 Setup Python
        if: steps.spec.outputs.found == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Every node in archon-greenfield declares `runtime: uv`, and Archon resolves
      # those through the `uv` binary — but nothing installed it: not this workflow,
      # not setup.sh, and the runner image is not guaranteed to carry it. On a runner
      # without it the very first script node (load) fails before it reads the spec,
      # so the job went red for a missing toolchain rather than a bad app.
      # Pinned to an exact release, not a major tag: astral-sh/setup-uv publishes no
      # floating `v10`, and a `@v10` here fails the whole job at "Set up job" — before
      # the resolve step, so the run is red with nothing to read.
      - name: ⚡ Setup uv (the runtime archon-greenfield's nodes declare)
        if: steps.spec.outputs.found == 'true'
        uses: astral-sh/setup-uv@v10.1.0

      - name: 🏗️ Run Monolithic Setup
        if: steps.spec.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "$TELEGRAM_BOT_TOKEN" | ./setup.sh

      # The workflow engine. This job used to assume setup.sh had provided it, and it
      # had not: setup.sh clones the Archon *source* into core-modules/ and chmods a
      # binary that a source clone does not contain (`bin/archon` is a release
      # artifact), so on a clean runner the build died with "no working archon CLI
      # found" — the one thing it cannot run without. Installed exactly the way
      # scripts/bootstrap.sh installs it, so the two cannot drift into two answers.
      - name: 🧩 Install the Archon CLI (the workflow engine)
        if: steps.spec.outputs.found == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://archon.diy/install | bash
          archon --version

      # The coding agent itself. setup.sh provisions the core modules and the gateway,
      # but neither the agent nor the CLI above — the build step has nothing to run
      # without either. Installed from the same source bootstrap.sh uses.
      - name: 🤖 Install the Coding Agent (Codex)
        if: steps.spec.outputs.found == 'true'
        run: npm install -g @openai/codex

      - name: 🌐 Initialize Background Cloud Gateway (OmniRoute)
        if: steps.spec.outputs.found == 'true'
        run: |
          cd core-modules/omniroute
          npm run start &
          sleep 5

      # NO FACTORY PIN STEP. App manufacturing does not go through the factory's
      # pinned SDLC source, and cannot: `factory.py run` only accepts workflows it
      # discovers inside that source, and refuses every command when the source is
      # dirty — so an app builder has no home there. It lives in this checkout
      # (.archon/workflows/app/greenfield/) and runs through the archon CLI. Dropping
      # the pin also drops the `factory init` it performed, which overwrote
      # factory/doctor.py — the file the olympus container's healthcheck runs.
      #
      # `scripts/manufacture.sh` is the SAME command `make app` runs, so the two
      # cannot drift into different behaviours.
      # Reported, not enforced. Whether the model can call a tool at all is exactly
      # the thing worth knowing *before* the build step spends minutes discovering it
      # by producing nothing, and on a runner with no route to the platform gateway
      # that is exactly what it reports — non-fatally, because a checkout that cannot
      # reach a gateway is this job's normal state and failing would say "the
      # pipeline is broken" about a deployment that simply is not wired to it.
      #
      # The URL is the gateway's DOOR (`:20129`, the SSO proxy that exempts /v1), not
      # its own `:20128`, which is published on the gateway host's loopback and bridge
      # alone. A self-hosted runner on that host writes
      # `http://host.docker.internal:20129/v1`; set the `OMNIROUTE_BASE_URL` repo
      # variable to point anywhere else. There is no bundled gateway to fall back on:
      # the `omniroute` service was removed when the shared one took over.
      - name: 🔎 Check the build model can call a tool
        if: steps.spec.outputs.found == 'true'
        continue-on-error: true
        env:
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL || 'http://192.168.1.46:20129/v1' }}
          OMNIROUTE_MODEL: auto/coding
          OMNIROUTE_MODEL_FALLBACK: oc/big-pickle
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -uo pipefail
          python3 scripts/build-model-check.py --json
          rc=$?
          case "$rc" in
            0) echo "::notice::the build model calls tools — a build can write files" ;;
            1) echo "::warning::no model in the chain calls a tool; the build below will exit 0 and write nothing. See docs/build-model.md" ;;
            *) echo "::warning::the build model could not be verified (gateway or config); treat this job's output as unverified" ;;
          esac

      - name: 🚀 Manufacture App from Specification
        if: steps.spec.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECS: ${{ steps.spec.outputs.specs }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL || 'http://192.168.1.46:20129/v1' }}
          # `auto/coding` is OmniRoute's own router: it survives a provider being
          # unlinked, and what it resolves to is the gateway's business, not this
          # job's. Treat this job's output as unverified until a gateway is reachable
          # and a model behind it has quota — the host-side runner pins a concrete
          # model in `.env` instead (see .env.example, docs/build-model.md).
          OMNIROUTE_MODEL: auto/coding
          OMNIROUTE_MODEL_FALLBACK: oc/big-pickle
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .factory-ci

          # Whether a build can happen at all is decided by the gateway, and a runner
          # with no route to it cannot manufacture anything. That is a wiring gap, not
          # a broken pipeline, so it is reported and the job ends green with nothing
          # built — which is what the check above already claims this job does.
          #
          # It has to be probed here rather than left to manufacture.sh: that script
          # refuses to start when the gateway is silent, deliberately, because for an
          # operator a build that dies 20 minutes in has burned the run. Correct for
          # `make app`, wrong for a runner that was never wired to a gateway.
          gateway="${OMNIROUTE_BASE_URL%/v1}"
          if ! curl -fsS -m 10 "$gateway/healthz" >/dev/null 2>&1; then
            {
              echo "no route to the build gateway: $gateway/healthz"
              echo "nothing was manufactured — this is a wiring gap, not a build failure"
              echo
              echo "fix, either one:"
              echo "  * set the OMNIROUTE_BASE_URL repo variable to a gateway this runner can"
              echo "    reach (the deployment's public door is https://gateway.olympus.innotel.us/v1)"
              echo "    and the OMNIROUTE_API_KEY secret the agent authenticates with; or"
              echo "  * set OLYMPUS_BUILD_RUNNER to a self-hosted runner on the gateway's host."
              echo
              echo "the spec that would have been built: ${SPECS}"
            } | tee .factory-ci/skipped.txt
            echo "::warning title=App not manufactured::build gateway unreachable — see .factory-ci/skipped.txt"
            exit 0
          fi

          for spec in $SPECS; do
            echo "Manufacturing from $spec"
            # Tee'd rather than left on the terminal. This step failing with no
            # readable log is why a red run here could not be diagnosed at all: the
            # job log needs repo-admin rights, and the failure was "exit 1" with
            # nothing attached to it. `pipefail` keeps the step's status honest
            # through the pipe.
            ./scripts/manufacture.sh "$spec" 2>&1 | tee -a .factory-ci/manufacture.log
          done

      - name: 📎 Keep the build log and what it produced
        # On failure as well as success, which is the point: a log you only get when
        # nothing went wrong is not evidence.
        if: always() && steps.spec.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: manufacture-${{ github.sha }}-${{ github.run_id }}
          path: |
            .factory-ci/
            builds/*/MANIFEST.json
            builds/*/project.manifest.json
            builds/*/plan.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
