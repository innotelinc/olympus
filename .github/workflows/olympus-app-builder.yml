name: 🏭 Olympus App Manufacturing Engine

# Only a genuinely new spec should manufacture an app. Note that `paths` alone is
# not enough: a force-push (e.g. a history rewrite) re-presents the whole tree, so
# this workflow runs even when no spec was added. The resolve step below decides,
# and every later step is gated on its output.
on:
  push:
    paths:
      - 'build-requests/*.md'

permissions:
  contents: write

jobs:
  build-new-app:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.spec.outputs.found }}
    steps:
      - name: 📁 Checkout Olympus Workspace
        uses: actions/checkout@v4
        with:
          # Need history to diff the pushed range, not just the tip.
          fetch-depth: 0

      - name: 🔎 Resolve the spec this push actually adds
        id: spec
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          head_sha="${AFTER:-$GITHUB_SHA}"

          # `before` is all-zeros on a new branch, and unreachable after a
          # force-push. Neither means "a new spec was written", so skip rather
          # than manufacture from a rewrite.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No usable previous commit (new branch or rewritten history) — nothing to manufacture."
            exit 0
          fi

          mapfile -t specs < <(
            git diff --name-only --diff-filter=A "$BEFORE..$head_sha" -- 'build-requests/*.md' \
              | grep -v 'README.md' || true
          )

          if [ "${#specs[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new build-requests/*.md in $BEFORE..$head_sha — nothing to manufacture."
            exit 0
          fi

          printf 'specs=%s\n' "${specs[*]}" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          printf '  %s\n' "${specs[@]}"

      - name: ⚙️ Setup Monolithic Runtimes (Node & Python)
        if: steps.spec.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 🍞 Setup Bun
        if: steps.spec.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
      - name: 🐍 Setup Python
        if: steps.spec.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🏗️ Run Monolithic Setup
        if: steps.spec.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "$TELEGRAM_BOT_TOKEN" | ./setup.sh

      # The coding agent itself. setup.sh provisions the core modules, the archon CLI
      # and the gateway, but not the agent — and the build step has nothing to run
      # without it. ("./scripts/bootstrap.sh" installs it too; this is the one piece
      # app manufacturing needs from it.)
      - name: 🤖 Install the Coding Agent (Codex)
        if: steps.spec.outputs.found == 'true'
        run: npm install -g @openai/codex

      - name: 🌐 Initialize Background Cloud Gateway (OmniRoute)
        if: steps.spec.outputs.found == 'true'
        run: |
          cd core-modules/omniroute
          npm run start &
          sleep 5

      # NO FACTORY PIN STEP. App manufacturing does not go through the factory's
      # pinned SDLC source, and cannot: `factory.py run` only accepts workflows it
      # discovers inside that source, and refuses every command when the source is
      # dirty — so an app builder has no home there. It lives in this checkout
      # (.archon/workflows/app/greenfield/) and runs through the archon CLI. Dropping
      # the pin also drops the `factory init` it performed, which overwrote
      # factory/doctor.py — the file the olympus container's healthcheck runs.
      #
      # `scripts/manufacture.sh` is the SAME command `make app` runs, so the two
      # cannot drift into different behaviours.
      # Reported, not enforced. This gateway has just been started by setup.sh and
      # carries no provider credentials, so whether the model can call a tool at all
      # is exactly the thing worth knowing *before* the build step spends minutes
      # discovering it by producing nothing. It stays non-fatal because this job is
      # the pipeline's demonstration path: a checkout with no gateway credentials is
      # its normal state, and failing the job would say "the pipeline is broken"
      # about a deployment that simply has no provider with quota.
      - name: 🔎 Check the build model can call a tool
        if: steps.spec.outputs.found == 'true'
        continue-on-error: true
        env:
          OMNIROUTE_BASE_URL: http://127.0.0.1:20128/v1
          OMNIROUTE_MODEL: auto/coding
          OMNIROUTE_MODEL_FALLBACK: oc/big-pickle
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -uo pipefail
          python3 scripts/build-model-check.py --json
          rc=$?
          case "$rc" in
            0) echo "::notice::the build model calls tools — a build can write files" ;;
            1) echo "::warning::no model in the chain calls a tool; the build below will exit 0 and write nothing. See docs/build-model.md" ;;
            *) echo "::warning::the build model could not be verified (gateway or config); treat this job's output as unverified" ;;
          esac

      - name: 🚀 Manufacture App from Specification
        if: steps.spec.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECS: ${{ steps.spec.outputs.specs }}
          OMNIROUTE_BASE_URL: http://127.0.0.1:20128/v1
          # This gateway is started fresh by setup.sh, so it has NO provider
          # connections and `auto/coding` has no credentialed member to route to — the
          # free pool member is all that can answer here. It answers in prose rather
          # than calling tools, so treat this job's output as unverified until the
          # gateway has a provider with quota; the host runner pins a concrete model in
          # `.env` instead (see .env.example).
          OMNIROUTE_MODEL: auto/coding
          OMNIROUTE_MODEL_FALLBACK: oc/big-pickle
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .factory-ci
          for spec in $SPECS; do
            echo "Manufacturing from $spec"
            # Tee'd rather than left on the terminal. This step failing with no
            # readable log is why a red run here could not be diagnosed at all: the
            # job log needs repo-admin rights, and the failure was "exit 1" with
            # nothing attached to it. `pipefail` keeps the step's status honest
            # through the pipe.
            ./scripts/manufacture.sh "$spec" 2>&1 | tee -a .factory-ci/manufacture.log
          done

      - name: 📎 Keep the build log and what it produced
        # On failure as well as success, which is the point: a log you only get when
        # nothing went wrong is not evidence.
        if: always() && steps.spec.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manufacture-${{ github.sha }}-${{ github.run_id }}
          path: |
            .factory-ci/
            builds/*/MANIFEST.json
            builds/*/project.manifest.json
            builds/*/plan.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
